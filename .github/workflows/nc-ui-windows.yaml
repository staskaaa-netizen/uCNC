name: Programming Station (Windows)

# The PC programming station (tools/nc_ui_win) is the NC screen on Windows: the
# same panel layout, the same key meanings and the same G7x cycles, built for a
# desk instead of the machine. Every push and pull request builds it and runs its
# checks; the release itself attaches the same station (see the `station` job in
# pio-release.yaml), so the Windows version is downloaded from the release page
# rather than built by hand.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  station:
    name: Build and check
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # MinGW-w64 is the toolchain the tool is built with (`tools/nc_ui_win/
      # Makefile`, `CC` for `tools/test_nc_ui.py`): the station links the
      # firmware sources statically, so a shipped exe needs no DLL beside it.
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # `tools/test_nc_ui.py` is the tool's build *and* run script: it compiles
      # the station, renders a panel frame, and runs every headless check
      # (filesystem, presets, keypad, spindle signal, feed, editor, path builder,
      # RUN). A station that does not check out does not ship.
      - name: Build the station and run its checks
        shell: pwsh
        run: |
          $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin;$env:PATH"
          python tools/test_nc_ui.py

      - name: Package the station
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item tmp/nc-ui-tests/nc_ui.exe dist/uCNC-programming-station.exe
          Copy-Item tools/nc_ui_win/README.md dist/README.md
          Copy-Item docs/desktop-sender.md dist/desktop-sender.md
          Compress-Archive -Path dist/* -DestinationPath uCNC-programming-station-win64.zip -Force

      - name: Upload the built station
        uses: actions/upload-artifact@v7
        with:
          name: uCNC-programming-station-win64
          path: uCNC-programming-station-win64.zip
