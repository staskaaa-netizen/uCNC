; The USB (DisplayLink) display target: the same uCNC machine and the same
; `ncc` panel, with the picture on a DisplayLink adapter instead of the Sharp
; LVDS panel. See src/modules/usb_display/README.md.
;
; It is not built unless it is asked for by name:
;
;   pio run -e RP2350-NCC-USB
;
; and it is not in `default_envs`, so a bare `pio run` still builds the LVDS
; machine. The native USB port is the display's host here, so the console and
; the G-code protocol are on UART0 (GP0/GP1) - see the board map beside this
; file.
[env:RP2350-NCC-USB]
extends = common_rp2350
board = generic_rp2350
custom_ucnc_modules =
extra_scripts =
    ${env.extra_scripts}
    pre:uCNC/src/modules/usb_display/ucnc_usb_host.py
build_flags =
    ${rp2350_leancam_minimal_flags.build_flags}
    -D PICO_BOARD=\"waveshare_rp2350_pizero\"
    -D ENABLE_NCC_MODULE
    ; The console and the G-code protocol are on UART0: the USB port is the
    ; display's host on this target.
    -D BOARDMAP=\"src/modules/usb_display/boardmap_waveshare_pizero_usb.h\"
    ; 16 bpp single-plane scanout: the frame is written into the adapter's own
    ; memory, which is what the plane-level write API is for.
    -D DLO_VIEW_BPP=16
    -D DLO_EXPERIMENT_API=1
    ; TinyUSB host, raw endpoint transfers for the DisplayLink bulk pipe, with
    ; this module's own configuration file.
    -D CFG_TUH_API_EDPT_XFER=1
    ; TinyUSB's own configuration is forced in for every translation unit: the
    ; framework's built-in one configures the controller as a device only, and
    ; a prebuilt device stack cannot be turned into a host at link time.
    -include uCNC/src/modules/usb_display/tusb_config.h
    -I src/modules/usb_display/libdlo/src
lib_deps =
    ${common_rp2350.lib_deps}
    LittleFS
lib_ignore =
    HTTPUpdateServer
    WiFi
    WebServer
    SerialBT
    DNSServer
    Hash
    BluetoothSerial
    Wire
    FatFS
build_src_filter =
    ${env:RP2350-LEANCAM-MINIMAL.build_src_filter}
    +<src/modules/encoder.c>
    +<src/modules/g33/>
    +<src/modules/rp2350_pio_encoder/>
    ; The lvds_renderer module's portable half - the palette, the fonts, the
    ; draw API, the PSRAM and the boot path. Its HSTX backend is deliberately
    ; left out: this module provides the backend instead, and both cannot be in
    ; one firmware.
    +<src/modules/lvds_renderer/lvds_draw_api.c>
    +<src/modules/lvds_renderer/lvds_palette.c>
    +<src/modules/lvds_renderer/lvds_font_cond_6x8.c>
    +<src/modules/lvds_renderer/lvds_font_ibm_8x14.c>
    +<src/modules/lvds_renderer/lvds_psram.c>
    +<src/modules/lvds_renderer/lvds_renderer_boot.c>
    +<src/modules/usb_display/>
    +<src/modules/sd_card_v2/>
    +<src/modules/file_system.c>
    +<src/modules/softi2c.c>
    +<src/modules/softspi.c>
    +<src/modules/cam_keyboard/>
    +<src/modules/ncc/>
    -<src/modules/ncc/tests/>
    -<src/modules/nc/>
    -<src/modules/nc2/>
    +<src/modules/g7x/>
    -<src/modules/g7x/tests/>
    -<src/modules/lathe_comp/tests/>
    +<src/modules/g7_g8/>
    -<src/modules/leanCam/>
