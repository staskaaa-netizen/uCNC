name: Programming Station Release (Windows)

# A release of this fork is the PC programming station, and nothing else. The
# RP2350 image is not published: it drives this machine's own HSTX-connected
# LVDS panel, so a downloaded .uf2 is of no use anywhere but here - and it is
# flashed from the bench anyway. The machine firmware is still built and
# checked locally (`pio run -e RP2350-LEANCAM-LVDS`, `-e RP2350-G7X-MODULE`,
# see AGENTS.md), and the station's own checks compile the NC, G7x and LVDS
# sources the panel and the station share.

on:
  push:
    tags:
      - "v*"

jobs:
  station:
    name: Build and release the station
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # MinGW-w64: the station links the firmware sources statically, so the
      # released exe runs without the toolchain beside it.
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Which toolchain this is, in the log, before anything can fail on it.
      - name: Show the toolchain
        shell: pwsh
        run: |
          $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin;$env:PATH"
          gcc --version | Select-Object -First 1
          python --version

      # The station is built, rendered and checked before it is packed: a
      # release asset is never a build that has not run its own tests.
      - name: Build the station and run its checks
        shell: pwsh
        run: |
          $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin;$env:PATH"
          python tools/test_nc_ui.py

      - name: Package the station
        run: python tools/pack_nc_ui.py --skip-build

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: uCNC programming station ${{ github.ref_name }}
          body: |
            The uCNC programming station for Windows: the NC screen, the machine's
            own keypad and the G7x lathe cycles on a PC, built from this
            repository's sources (`tools/nc_ui_win`).

            Download `uCNC-programming-station-win64.zip`, unpack it anywhere and
            run `uCNC-programming-station.exe`. The `examples\` folder beside it is
            the demo: a station that has no card of its own seeds one from it, so
            the first start opens with `lathe-demo.nc` and the tool table it calls.

            The station is the whole of what is published here. The RP2350 image
            drives this machine's own HSTX-connected LVDS panel, so it is built and
            flashed from the bench (`pio run -e RP2350-LEANCAM-LVDS`, see
            AGENTS.md) rather than released.

            `uCNC-programming-station.exe --version` - and the window title - say
            which build an exe is, so a copy can be matched against this one.
          draft: false
          prerelease: false
          files: tools/nc_ui_win/dist/uCNC-programming-station-win64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
