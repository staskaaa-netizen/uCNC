name: PlatformIO CI Tests

on:
  push:

jobs:
  unit-tests:
    name: Linux Unit Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-v2-${{ runner.os }}-${{ hashFiles('platformio.ini', 'uCNC/src/hal/boards/**/*.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install "platformio==6.1.18"

      - name: Run Linux unit tests
        shell: bash
        run: |
          # The reason goes into an annotation as well as the log: the log needs
          # rights a reader may not have, and this job builds the whole tree.
          if ! pio test -e EMULATOR_LINUX_TEST > pio-test.log 2>&1; then
            cat pio-test.log
            reason=$(tail -40 pio-test.log | tr '\n' ' ' | tr -d '\r' | sed 's/%/%25/g' | cut -c1-1200)
            echo "::error title=EMULATOR_LINUX_TEST::${reason}"
            exit 1
          fi
          tail -20 pio-test.log

  build:
    name: Build & Test Firmware
    needs: unit-tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        boards:
          - LPC176X-RE-ARM
          - ESP8266-Wemos-D1-R2
          - AVR-UNO
          - ESP32-MKS-TINYBEE
          - STM32F0-Bluepill-F030C8
          - STM32F1-Bluepill-F103C8
          - AVR-RAMBO
          - RP2040-PICO-W
          - SAMD21-Wemos-M0
          - STM32F4-Blackpill-F401CC
          - STM32H7-Generic-STM32H750
          - AVR-MEGA2560-RAMPS-V1_4
          - RP2350-PICO2
          - ESP32-S3
          - ESP32-C3

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-v2-${{ runner.os }}-${{ hashFiles('platformio.ini', 'uCNC/src/hal/boards/**/*.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install "platformio==6.1.18"

      - name: Run PlatformIO Build
        shell: bash
        run: |
          if ! pio run -e ${{ matrix.boards }} > pio-build.log 2>&1; then
            cat pio-build.log
            reason=$(tail -40 pio-build.log | tr '\n' ' ' | tr -d '\r' | sed 's/%/%25/g' | cut -c1-1200)
            echo "::error title=${{ matrix.boards }}::${reason}"
            exit 1
          fi
          tail -10 pio-build.log
