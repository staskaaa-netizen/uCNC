##################
# RP2350 Boards #
##################

[common_rp2350]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
platform_packages = framework-arduinopico@https://github.com/earlephilhower/arduino-pico.git
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
; change microcontroller
board_build.mcu = rp2350
; change MCU frequency
board_build.f_cpu = 150000000L
; lib_deps = adafruit/Adafruit TinyUSB Library@^2.0.3
build_flags = ${env.build_flags} -std=gnu99 -Wall -fdata-sections -ffunction-sections -fno-exceptions -Wl,--gc-sections -DRAM_ONLY_SETTINGS
    ; Every screen says its numbers with `snprintf("%.3f")` - the DRO, the
    ; preview's dimensions, and the blocks a cycle expands to. Newlib-nano,
    ; which this core links, **drops float conversions** unless the float
    ; formatter is pulled in, and a dropped one is an empty string: the machine
    ; was handed `G0 X` where the panel meant `G0 X55.000` and refused it
    ; (error 2, "invalid number" - bench, 2026-09-27). The host is no guide: it
    ; links glibc, which formats floats whether or not anyone asks.
    -Wl,-u,_printf_float
debug_tool = cmsis-dap
lib_deps = 
    ${env.lib_deps}
		SPI	
		Wire
		EEPROM
lib_ignore = 
		HTTPUpdateServer
		WiFi
		WebServer
		SerialBT
		DNSServer
		Hash
		BluetoothSerial

[env:RP2350-PICO2]
extends = common_rp2350
board = generic_rp2350
build_flags = ${common_rp2350.build_flags} -D BOARDMAP=\"src/hal/boards/rp2350/boardmap_rpi_pico2.h\"
lib_deps = 
    ${env.lib_deps}
		SPI	
		Wire
		EEPROM

[env:RP2350-CUSTOM]
extends = common_rp2350
build_flags = ${common_rp2350.build_flags} -DMCU=MCU_CUSTOM
board = ${env.board}

[rp2350_leancam_minimal_flags]
build_flags =
    ${common_rp2350.build_flags}
    -D MCU=MCU_RP2350
    -D BOARDMAP=\"src/hal/boards/rp2350/boardmap_waveshare_pizero_minimal.h\"
    -D PICO_PIO_USE_GPIO_BASE=1
    -D IC74HC595_COUNT=0
    -D IC74HC165_COUNT=0
    -D RAM_ONLY_SETTINGS
    ; The panels send `M2` as the end of a program, and the core answers that
    ; with an end-of-program *lock* (`EXEC_POSITION_MAYBE_LOST`, then
    ; `STATUS_PROGRAM_ENDED` for every line after it) unless the lock is
    ; switched off. The station builds with it off, so the host could never see
    ; the difference: the machine would have finished a program and then refused
    ; the next run until it was unlocked (bench, 2026-09-28 - "with m2 it nicely
    ; goes to the end", one run before the next one meets the lock). One answer
    ; for both: the panel's own `# RELOAD`/new run is the operator saying go on.
    -D DISABLE_ENDPROGRAM_LOCK

[env:RP2350-LEANCAM-MINIMAL]
extends = common_rp2350
board = generic_rp2350
custom_ucnc_modules =
build_flags =
    ${rp2350_leancam_minimal_flags.build_flags}
    -D UCNC_MINIMAL_RP2350
    -D UCNC_IGNORE_BOARDMAP_OVERRIDES
    -D DISABLE_G7_G8
lib_ignore =
    ${common_rp2350.lib_ignore}
    Wire
build_src_filter =
    +<*>
    +<*.ino>
    -<src/hal/mcus/avr/>
    -<src/hal/mcus/esp32/>
    -<src/hal/mcus/esp32c3/>
    -<src/hal/mcus/esp32common/>
    -<src/hal/mcus/esp32s3/>
    -<src/hal/mcus/esp8266/>
    -<src/hal/mcus/lpc176x/>
    -<src/hal/mcus/rp2040/>
    -<src/hal/mcus/samd21/>
    -<src/hal/mcus/stm32f0x/>
    -<src/hal/mcus/stm32f1x/>
    -<src/hal/mcus/stm32f4x/>
    -<src/hal/mcus/stm32h7x/>
    -<src/hal/mcus/virtual/>
    -<src/modules/cam_keyboard/>
    -<src/modules/esp32_pcnt_encoder/>
    -<src/modules/g33/>
    -<src/modules/g33_ELS/>
    -<src/modules/g7_g8/>
    -<src/modules/g7x/tests/>
    -<src/modules/leanCam/>
    -<src/modules/lvds_renderer/>
    ; The USB display backend is a different scanout for the same machine: it is
    ; compiled only by the target that asks for it (<src/modules/usb_display/>,
    ; re-added there), never into the LVDS ones.
    -<src/modules/usb_display/>
    -<src/modules/ra8876_display/>
    -<src/modules/ra8876_test/>
    -<src/modules/sd_card_v2/>
    -<src/modules/ncc/>
    -<src/modules/nc_sender/>
    -<src/modules/encoder.c>
    -<src/modules/digimstep.c>
    -<src/modules/digipot.c>
    ; Kept excluded by default; the LVDS target opts native storage back in.
    -<src/modules/file_system.c>
    -<src/modules/modbus.c>
    -<src/modules/pid.c>
    -<src/modules/shift_register.c>
    -<src/modules/softi2c.c>
    -<src/modules/softspi.c>
    -<src/modules/softuart.c>
    -<src/modules/system_menu.c>

[env:RP2350-LEANCAM-LVDS]
extends = common_rp2350
board = generic_rp2350
custom_ucnc_modules =
extra_scripts =
    ${env.extra_scripts}
build_flags =
    ${rp2350_leancam_minimal_flags.build_flags}
    -D PICO_BOARD=\"waveshare_rp2350_pizero\"
    -D ENABLE_NC_MODULE
lib_deps =
    ${common_rp2350.lib_deps}
    LittleFS
lib_ignore =
    HTTPUpdateServer
    WiFi
    WebServer
    SerialBT
    DNSServer
    Hash
    BluetoothSerial
    Wire
    FatFS
build_src_filter =
    ${env:RP2350-LEANCAM-MINIMAL.build_src_filter}
    +<src/modules/encoder.c>
    +<src/modules/g33/>
    +<src/modules/rp2350_pio_encoder/>
    +<src/modules/lvds_renderer/>
    +<src/modules/sd_card_v2/>
    +<src/modules/file_system.c>
    +<src/modules/softi2c.c>
    +<src/modules/softspi.c>
    +<src/modules/cam_keyboard/>
    +<src/modules/nc2/>
    ; nc is retired: the panel is nc2, and `LOAD_MODULES_OVERRIDE()` in
    ; cnc_hal_overrides.h loads it. The sources stay in the tree, unbuilt.
    -<src/modules/nc/>
    +<src/modules/g7x/>
    -<src/modules/g7x/tests/>
    ; The compensation geometry G7x consumes. Its own host test has a `main()`
    ; of its own, so it is not firmware either.
    -<src/modules/lathe_comp/tests/>
    +<src/modules/g7_g8/>
    -<src/modules/leanCam/>

; The third NC panel: `ncc` is the clean rebuild (nc's feature set, nc2's tree,
; the presets in RAM). It is the same board and the same renderer as the LVDS
; target, so the two panels are picked here, one env each, never both at once.
[env:RP2350-LEANCAM-LVDS-NCC]
extends = common_rp2350
board = generic_rp2350
custom_ucnc_modules =
extra_scripts =
    ${env.extra_scripts}
build_flags =
    ${rp2350_leancam_minimal_flags.build_flags}
    -D PICO_BOARD=\"waveshare_rp2350_pizero\"
    -D ENABLE_NCC_MODULE
    ; The glass is mounted turned, so the picture is portrait (600x800) and
    ; `ncc_layout.h` lays the five bands out for it. To read the panel upright
    ; add `-D LVDS_PANEL_TURN=0` here and the same layout file lays out
    ; 800x600; nothing else in the module changes.
lib_deps =
    ${common_rp2350.lib_deps}
    LittleFS
lib_ignore =
    HTTPUpdateServer
    WiFi
    WebServer
    SerialBT
    DNSServer
    Hash
    BluetoothSerial
    Wire
    FatFS
build_src_filter =
    ${env:RP2350-LEANCAM-MINIMAL.build_src_filter}
    +<src/modules/encoder.c>
    +<src/modules/g33/>
    +<src/modules/rp2350_pio_encoder/>
    +<src/modules/lvds_renderer/>
    +<src/modules/sd_card_v2/>
    +<src/modules/file_system.c>
    +<src/modules/softi2c.c>
    +<src/modules/softspi.c>
    +<src/modules/cam_keyboard/>
    +<src/modules/ncc/>
    ; The module's host test has a `main()` of its own: it is not firmware.
    -<src/modules/ncc/tests/>
    +<src/modules/nc_sender/>
    -<src/modules/nc_sender/tests/>
    ; nc and nc2 stay out of this target: `ncc` is the panel it loads.
    -<src/modules/nc/>
    -<src/modules/nc2/>
    +<src/modules/g7x/>
    -<src/modules/g7x/tests/>
    ; The compensation geometry G7x consumes (never its host test: that has a
    ; `main()` of its own).
    -<src/modules/lathe_comp/tests/>
    +<src/modules/g7_g8/>
    -<src/modules/leanCam/>

[env:RP2350-G7X-MODULE]
extends = common_rp2350
board = generic_rp2350
custom_ucnc_modules =
build_flags =
    ${rp2350_leancam_minimal_flags.build_flags}
    -D UCNC_MINIMAL_RP2350
    -D UCNC_IGNORE_BOARDMAP_OVERRIDES
    -D UCNC_IGNORE_HAL_OVERRIDES
    -D ENABLE_MAIN_LOOP_MODULES
    -D ENABLE_PARSER_MODULES
    -D ENABLE_G7X_MODULE
lib_ignore =
    ${common_rp2350.lib_ignore}
    Wire
build_src_filter =
    ${env:RP2350-LEANCAM-MINIMAL.build_src_filter}
    -<src/modules/nc/>
    -<src/modules/nc2/>
    -<src/modules/rp2350_pio_encoder/>
    +<src/modules/g7x/>
    -<src/modules/g7x/tests/>
    +<src/modules/g7_g8/>


